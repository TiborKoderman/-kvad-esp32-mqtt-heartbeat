[env:esp32s3-n16r8]
platform            = espressif32
framework           = espidf
board               = esp32-s3-devkitc-1-n16r8v     ; <-- matches boards/<name>.json (without .json)
board_build.filesystem = littlefs

; PSRAM + memory wiring for S3 N16R8 (Octal)
board_build.arduino.memory_type = opi_opi        ; use qio_qspi if not an OPI module
board_build.flash_mode          = qio
board_build.flash_size          = 16MB

; nice-to-have
monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder, time
lib_deps = 
    bblanchon/ArduinoJson@^6.21.3

; If you need IDF headers (e.g., esp-mqtt) in Arduino sketches
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D USE_PSRAM
  -D CORE_DEBUG_LEVEL=1